!
hostname sw1
!
service password-encryption
no ip source-route
enable secret 9 $9$synthetic0000000000000000000000000000
username ops secret 9 $9$synthetic0000000000000000000000000000
!
ip ssh version 2
logging host 192.0.2.50
ntp server 192.0.2.60
banner login ^C Authorised use only ^C
!
ip access-list standard MGMT
 permit 192.0.2.0 0.0.0.255
!
line vty 0 15
 access-class MGMT in
 login local
 transport input ssh
!
end
