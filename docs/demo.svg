<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of netconf-audit on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">netconf-audit</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./bin/netconf-audit examples/configs</text><text class="r d0 " x="20" y="108" xml:space="preserve">2 files, 18 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">HIGH     NC002 edge-rtr1:line 4</text><text class="r d2 " x="20" y="152" xml:space="preserve">         enable password is stored reversibly or in cleartext; use &#x27;enable secret&#x27; with scrypt (type 9)</text><text class="r d3 h" x="20" y="174" xml:space="preserve">HIGH     NC004 edge-rtr1:line 7</text><text class="r d4 " x="20" y="196" xml:space="preserve">         local user with &#x27;password&#x27; (cleartext or type 7 reversible); use &#x27;secret&#x27; with scrypt (type 9)</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     NC003 edge-rtr1:line 11</text><text class="r d6 " x="20" y="240" xml:space="preserve">         SNMP community uses the well-known name &#x27;public&#x27;</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH     NC003 edge-rtr1:line 12</text><text class="r d8 " x="20" y="284" xml:space="preserve">         SNMP community with read-write access; prefer SNMPv3 and read-only</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH     NC005 edge-rtr1:line 19</text><text class="r d10 " x="20" y="328" xml:space="preserve">         line password is a well-known default</text><text class="r d11 h" x="20" y="350" xml:space="preserve">HIGH     NC001 edge-rtr1:line 20</text><text class="r d12 " x="20" y="372" xml:space="preserve">         line vty 0 4: transport input all allows telnet; use &#x27;transport input ssh&#x27;</text><text class="r d13 h" x="20" y="394" xml:space="preserve">HIGH     NC005 edge-rtr1:line 21</text><text class="r d14 " x="20" y="416" xml:space="preserve">         line password is a well-known default</text><text class="r d15 h" x="20" y="438" xml:space="preserve">HIGH     NC001 edge-rtr1:line 24</text></svg>
